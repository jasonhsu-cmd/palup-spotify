# Shopify app configuration — ADR-0020 D1 (webhook custody) + D4 (catalog/inventory ingestion).
#
# This declares the app's Admin scopes and its webhook subscriptions DECLARATIVELY (Shopify auto-subscribes
# on install; no persisted offline Admin token → lowest blast radius — ADR-0020 D1). Schema verified against
# shopify.dev "App configuration" reference (retrieved 2026-08-08): top-level client_id/name/application_url/
# embedded; [access_scopes].scopes; [webhooks].api_version; [[webhooks.subscriptions]] topics/uri (uri may be
# a relative path). Fact-checked values (ADR-0020, 2026-08-07): the topic→scope mappings and the 2026-07
# stable version.
#
# TWO THINGS TO SET AT DEPLOY (placeholders here — this repo does not deploy via the Shopify CLI today):
#   • client_id / application_url are the real app's values in the Partner dashboard.
#   • Validate the compliance-topic declaration against `shopify app deploy` before first use — the three
#     mandatory privacy webhooks may need the `compliance_topics` grouping rather than plain `topics`
#     depending on the CLI version; they are given their OWN uris here to match the SEPARATE-PATH design in
#     packages/widget-backend/src/routes/shopify-webhooks.ts (the X-Shopify-Topic header is unsigned, so one
#     endpoint per topic is deliberate — see that file's header).
#
# The Storefront delegate scope (`unauthenticated_read_product_listings`) is NOT here: catalog/policy READS
# stay on the Storefront delegate token (ADR-0020 D1, unchanged), issued on the code install path
# (INSTALL_SCOPES_DEFAULT). This file carries only the minimal ADMIN READ scopes the ingestion webhooks
# require — no write, order, or customer scopes.

client_id = "REPLACE_WITH_APP_CLIENT_ID"
name = "PalUp"
application_url = "https://REPLACE_WITH_APP_HOST"
embedded = false

[access_scopes]
# D1: the minimal Admin READ scopes the ingestion webhooks require. read_inventory does NOT authorize
# surfacing stock counts — the boolean-only availableForSale contract stays (§8a inv 11).
scopes = "read_products,read_inventory"

[webhooks]
api_version = "2026-07"

# ── A3 (D4) — catalog/inventory ingestion. Each topic → its own route (verify → enqueue → 200). ──────
[[webhooks.subscriptions]]
topics = [ "products/create" ]
uri = "/shopify/webhooks/products/create"

[[webhooks.subscriptions]]
topics = [ "products/update" ]
uri = "/shopify/webhooks/products/update"

[[webhooks.subscriptions]]
topics = [ "products/delete" ]
uri = "/shopify/webhooks/products/delete"

[[webhooks.subscriptions]]
topics = [ "inventory_levels/update" ]
uri = "/shopify/webhooks/inventory_levels/update"

# ── Lifecycle — makes an uninstall real (C2). ────────────────────────────────────────────────────────
[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/shopify/webhooks/app/uninstalled"

# ── Mandatory privacy/compliance webhooks (C2). Own uris to match the separate-path design; confirm the
#    compliance_topics-vs-topics form against `shopify app deploy` before first use (see header note). ──
[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request" ]
uri = "/shopify/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/redact" ]
uri = "/shopify/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = [ "shop/redact" ]
uri = "/shopify/webhooks/shop/redact"
