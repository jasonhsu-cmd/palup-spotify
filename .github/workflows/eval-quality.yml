name: eval-quality (live judge on merge)

# The LIVE 190-case judge. MANUAL-ONLY (owner decision 2026-08-07): the auto `push: main` trigger was
# removed as part of disabling GitHub CI — run it on demand ("Run workflow") when you want a live-model
# quality read, e.g. after a model change. DORMANT regardless until you set variable JUDGE_ENABLED=true +
# secret ANTHROPIC_API_KEY. GCP auth is Workload Identity Federation, reusing the secrets set by
# scripts/setup-staging.sh (GCP_WIF_PROVIDER, GCP_DEPLOY_SA, GCP_PROJECT) — no long-lived key. The local
# `pnpm eval` gate (run by merge-gate.sh) covers the deterministic mock-model eval on every merge; this
# live judge is a separate, on-demand check. See docs/DEPLOY.md.
on:
  workflow_dispatch:

jobs:
  live-judge:
    if: ${{ vars.JUDGE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # to open a regression issue
      id-token: write # Workload Identity Federation (no long-lived key)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Authenticate to Google Cloud (Vertex, via Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - name: Run live 190-case judge (Gemini agent, cross-family Claude judge)
        id: evalfull
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GCP_LOCATION || 'global' }}
          PALUP_MODEL: ${{ vars.PALUP_MODEL || 'gemini-2.5-flash' }}
          JUDGE_FAMILY: anthropic
          # Cross-family judge for the bulk 190-case run (Sonnet — balanced; Opus reserved for gating).
          ANTHROPIC_MODEL: ${{ vars.JUDGE_MODEL || 'claude-sonnet-5' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # eval:full itself exits non-zero on any safety/injection FLOOR case failure.
        run: pnpm eval:full
      - name: Regression check vs baseline (tolerant of variance)
        id: regression
        run: pnpm eval:regression
      - name: Upload gap-map report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-gap-map
          path: reports/
      # Only file an issue for a REAL quality regression (floor fail in eval:full, or a drop in the
      # regression check) — not for an auth/infra failure (those just show as a red run).
      - name: Open an issue on regression
        if: ${{ !cancelled() && (steps.evalfull.outcome == 'failure' || steps.regression.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Live-judge quality regression on main ($(date -u +%Y-%m-%d))" \
            --body "The live 190-case judge regressed on \`main\` beyond tolerance (or a safety/injection floor case failed). See the run + the \`live-gap-map\` artifact: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "(could not open issue — check the run summary)"
