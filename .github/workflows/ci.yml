name: ci

# Mirrors build-automation.md §3c: unit/port-contract → self-improvement eval gate →
# application E2E. No auto-deploy: promotion to prod is a human action (locked decision §1).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit + port-contract tests
        run: pnpm test
      - name: Self-improvement eval gate (safety floor + no-regression)
        run: pnpm eval
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Application E2E (blocking pre-promotion gate)
        run: pnpm e2e
