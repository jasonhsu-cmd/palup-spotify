name: ci

# Mirrors build-automation.md §3c: typecheck → unit/port-contract → self-improvement eval gate →
# application E2E. No auto-deploy: promotion to prod is a human action (locked decision §1).
on:
  # main ONLY (owner decision 2026-08-07). PER-PR CI IS DISABLED: pull requests are gated LOCALLY by
  # `.claude/scripts/merge-gate.sh`, which runs these same seven steps on the merger's machine before a
  # merge — so a GitHub Actions outage can never block a merge, and CI minutes are reserved for the deploy
  # path. This run on `push: main` is kept ONLY as the gate `deploy-staging.yml` keys off
  # (`workflow_run: [ci]`, deploys iff conclusion == success), so nothing red reaches staging. A branch
  # with no PR still gets no CI; work reaches main only via a PR, now gated locally at merge time.
  push:
    branches: [main]

# One run per PR (or per ref). A force-push supersedes its own in-flight run instead of competing with
# it for a runner. Safe because every consumer treats a `cancelled` conclusion as NOT green.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # FIRST, because it is the cheapest step and because until now it did not exist: `tsc -b` failed
      # with TS5083 on every invocation ever (there was no root tsconfig) and CI never called it, while
      # `pnpm test` runs through esbuild, which transpiles without type-checking. There is no linter. So
      # NO stage in this repo type-checked anything, and the semantic conflict — PR A renames an export,
      # PR B adds a caller, both textually disjoint, both green — was entirely ungated.
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + port-contract tests
        run: pnpm test
      - name: Self-improvement eval gate (safety floor + no-regression)
        run: pnpm eval
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Application E2E (blocking pre-promotion gate)
        run: pnpm e2e
      - name: Control-plane self-improvement E2E (mock)
        run: pnpm e2e:monitor
      - name: Embed round-trip E2E (mock)
        run: pnpm e2e:embed
      - name: Storefront catalog E2E (mock, demo-tenant fixtures)
        run: pnpm e2e:storefront-catalog
      - name: pgvector ANN adapter (testcontainer)
        run: pnpm test:pgvector
