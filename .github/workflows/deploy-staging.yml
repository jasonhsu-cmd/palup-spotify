name: deploy-staging

# Auto-deploy to STAGING on merge to main (locked decision, build-automation.md §1). Production is
# never auto-deployed. INACTIVE until you set repo variable STAGING_ENABLED=true and the secrets below
# (so main stays green until staging is configured). See docs/DEPLOY.md.
on:
  # GATED ON CI (owner decision 2026-08-05). This previously triggered on `push: [main]` as a SIBLING of
  # ci.yml — no `needs:`, no dependency — so both started in the same second and a merge whose tests were
  # RED still deployed to staging. There is no rollback: the post-deploy smoke check below only reddens
  # the run, after live traffic is already being served the bad revision. With ~30 auto-merged PRs that
  # stops being a tail risk and becomes routine.
  #
  # `workflow_run` fires only after ci concludes; the `if` below additionally requires success, so a red
  # or cancelled ci never reaches a deploy. NOTE that a `workflow_run` job checks out the DEFAULT branch
  # by default, so the checkout step below pins the exact commit ci actually validated.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# Serialize deploys. Concurrent `gcloud run deploy --source .` against ONE service has already happened
# here three times (2026-08-04 05:52:37/44/51, all finishing 05:54:40): which revision ends up serving is
# not determined by commit order, and each run's own smoke check describes whatever revision is live —
# so a green smoke does not prove YOUR commit is the one serving. `cancel-in-progress: false` makes this
# a queue with latest-wins for anything superseded, which is the right semantics for a deploy.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.STAGING_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation (no long-lived keys)
    steps:
      # Pin the commit ci validated. A workflow_run job otherwise checks out the default branch's tip,
      # which by then may be a LATER commit that no ci run has passed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy widget backend to Cloud Run (staging)
        # NOTE: --set-secrets / --set-env-vars REPLACE the whole set on every deploy — any secret/env the
        # service needs MUST be listed here or it is silently dropped on the next merge-deploy. PALUP_SECRETS
        # + SHOPIFY_STORES wire live Shopify grounding (ADR-0012, docs/DEPLOY.md); omitting them reverts
        # grounding to the built-in fixtures with no error. SHOPIFY_STORES is JSON, so --set-env-vars uses
        # gcloud's ^@^ custom delimiter (pairs split on '@', not ',') to preserve its quotes/colons — the
        # value contains no '@'.
        #
        # WIDGET_EMBED_KEYS is now REQUIRED here. The backend used to fall back to a built-in
        # `demo-embed-key -> demo` registry whenever this was unset/malformed; that fallback fails OPEN
        # (every merchant collapses onto the fallback tenant — see resolveEmbedKeys in
        # packages/widget-backend/src/server.ts), so with PALUP_REQUIRE_DATABASE_URL=true the service now
        # REFUSES TO BOOT unless the registry is declared. Staging genuinely serves the demo tenant, so it
        # declares exactly that — the same value the built-in fallback used, now an explicit operator
        # choice. Same JSON-in-env pattern as SHOPIFY_STORES above (no '@' in the value). Adding a real
        # merchant means adding its publishable key here: {"demo-embed-key":"demo","<key>":"<tenant>"}.
        #
        # ── D3 — WHY THIS STEP IS NOW A SHELL SCRIPT INSTEAD OF ONE LONG INLINE FLAG ──────────────────
        # Track B added env vars that were documented in docs/DEPLOY.md and passed to NOTHING, so the code
        # reading them was unreachable in staging: C1's three install vars, and D2's MERCHANT_REGION —
        # which, unset, silently defaults to "us" and is therefore a residency decision made by an absent
        # variable. That is exactly the trap the NOTE above warns about, sprung.
        #
        # The list is built in shell rather than interpolated inline for ONE reason: several of these are
        # OPTIONAL, and an unset repo variable would interpolate to `NAME=` (an empty value). Whether
        # gcloud accepts an empty value in a ^@^-delimited --set-env-vars is NOT something this workflow
        # may find out on a live merge-deploy, so optional pairs are appended only when they have a value
        # and never emitted empty.
        #
        # Repo variables are read through `env:` (not interpolated into the script body) so a value
        # containing shell metacharacters is data, never code.
        #
        # WHAT IS DELIBERATELY NOT HERE:
        #   • `shopify_app_client_secret` (C1/C2's gate) and `MEMORY_ENCRYPTION_KEY__merchant-cred` (B2's
        #     per-tenant credential key) are JSON entries INSIDE the already-mounted `palup-secrets`
        #     secret, not Cloud Run mounts. An operator adds them to that secret's payload; there is
        #     nothing to add here, and adding a mount for them would be wrong.
        #   • a hard-coded `--set-secrets AUDIT_HMAC_SECRET=…:latest`. A reference to a Secret Manager
        #     secret that does not exist makes `gcloud run deploy` ITSELF fail, which would break every
        #     merge until someone created it. It is optional in code (server.ts falls back to
        #     SHOPPER_TOKEN_SECRET; `subjectRef` degrades to a literal "unreferenced (no AUDIT_HMAC_SECRET
        #     configured)" rather than throwing), so it is mounted only once an operator names an existing
        #     secret in the AUDIT_HMAC_SECRET_NAME repo variable.
        #   • a hard-coded `--set-secrets GUEST_TOKEN_SECRET=…:latest` (ADR-0019 Revision 2, R2-4). This is
        #     a SEPARATE secret from WIDGET_TOKEN_SECRET/SHOPPER_TOKEN_SECRET on purpose — sharing a key
        #     would mean one compromise forges both a merchant principal and any guest `aid`. Same
        #     fail-safe as AUDIT_HMAC_SECRET immediately above: a reference to a secret that does not exist
        #     makes `gcloud run deploy` itself fail, so this mounts only once an operator names an existing
        #     secret in the GUEST_TOKEN_SECRET_NAME repo variable. Absent ⇒ not mounted ⇒ guest tokens
        #     simply cannot be minted — correct while the feature is unbuilt/off (ADR-0019 task 10 is still
        #     gated on legal + owner re-acceptance; MEMORY_ADR_ACCEPTED is false).
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          WIDGET_AUTH_REQUIRED: ${{ vars.WIDGET_AUTH_REQUIRED || 'false' }}
          # D2 — the credential read-back gate (model.ts/merchant-store.ts's `resolveStorefrontCredential`).
          # Ships dark via `|| 'false'`, mirroring WIDGET_AUTH_REQUIRED exactly: an operator who flips this
          # straight on Cloud Run (docs/DEPLOY.md's go-live step) would otherwise have it silently reverted
          # to false by the very next merge-deploy, because --set-env-vars below REPLACES the whole set.
          MERCHANT_CRED_READBACK_ENABLED: ${{ vars.MERCHANT_CRED_READBACK_ENABLED || 'false' }}
          # Self-serve install (#291) — the OPT-IN shared base key for merchant-cred custody. Ships dark via
          # `|| 'false'`, same revert-guard rationale as READBACK above (a bare Cloud Run flip would be
          # reverted by the next merge-deploy). Enabling ALSO requires a high-entropy shared base secret
          # provisioned under the `__shared__` scope of the palup-secrets blob (secret name
          # `MEMORY_ENCRYPTION_KEY__merchant-cred`); the flag alone is fail-closed without it.
          MERCHANT_CRED_SHARED_KEY_ENABLED: ${{ vars.MERCHANT_CRED_SHARED_KEY_ENABLED || 'false' }}
          # D2 — the named fallback region/grounding mode for a tenant with NO pl_merchant row (staging's
          # `demo`). Registry merchants are served under their own row's values and ignore these entirely.
          # Defaulted here so the pair is never emitted empty, and so the value is VISIBLE rather than
          # being an unset variable that server.ts quietly reads as "us".
          MERCHANT_REGION: ${{ vars.MERCHANT_REGION || 'us' }}
          MERCHANT_GROUNDING_MODE: ${{ vars.MERCHANT_GROUNDING_MODE || 'full' }}
          # C1 — the Shopify app install. All three, or none: server.ts refuses to register the routes
          # unless every one is present (fully-configured-or-absent), so a partial set 404s silently.
          SHOPIFY_APP_CLIENT_ID: ${{ vars.SHOPIFY_APP_CLIENT_ID }}
          SHOPIFY_INSTALL_REDIRECT_URI: ${{ vars.SHOPIFY_INSTALL_REDIRECT_URI }}
          SHOPIFY_INSTALL_REGION: ${{ vars.SHOPIFY_INSTALL_REGION }}
          SHOPIFY_INSTALL_SCOPES: ${{ vars.SHOPIFY_INSTALL_SCOPES }}
          SHOPIFY_DELEGATE_SCOPES: ${{ vars.SHOPIFY_DELEGATE_SCOPES }}
          # The NAME of an existing Secret Manager secret, not the secret. Empty ⇒ not mounted.
          AUDIT_HMAC_SECRET_NAME: ${{ vars.AUDIT_HMAC_SECRET_NAME }}
          # ADR-0019 R2-4 — same pattern: the NAME of an existing Secret Manager secret, not the secret
          # itself. Empty ⇒ not mounted ⇒ guest tokens cannot be minted.
          GUEST_TOKEN_SECRET_NAME: ${{ vars.GUEST_TOKEN_SECRET_NAME }}
          # P4 — the durable Pub/Sub catalog-reconcile push route (CONSUME side). Set this repo variable to
          # the push endpoint URL (which MUST byte-equal the terraform subscription's OIDC audience) to
          # register the OIDC push route on staging so its gate can be smoke-verified BEFORE the producer is
          # enabled (the route is decoupled from CATALOG_WEBHOOKS). Empty ⇒ not set ⇒ route absent (inert).
          CATALOG_PUBSUB_AUDIENCE: ${{ vars.CATALOG_PUBSUB_AUDIENCE }}
        run: |
          set -euo pipefail

          # The '@' delimiter is only safe while no VALUE contains one. That held while every value was a
          # literal in this file; it stops being guaranteed now that operators supply some through repo
          # variables, and a stray '@' would not fail — it would silently split one value into two bogus
          # env pairs. Check rather than assume.
          for pair in "MERCHANT_REGION=${MERCHANT_REGION}" "MERCHANT_GROUNDING_MODE=${MERCHANT_GROUNDING_MODE}" \
                      "WIDGET_AUTH_REQUIRED=${WIDGET_AUTH_REQUIRED}" \
                      "MERCHANT_CRED_READBACK_ENABLED=${MERCHANT_CRED_READBACK_ENABLED}" \
                      "MERCHANT_CRED_SHARED_KEY_ENABLED=${MERCHANT_CRED_SHARED_KEY_ENABLED}" \
                      "SHOPIFY_APP_CLIENT_ID=${SHOPIFY_APP_CLIENT_ID:-}" \
                      "SHOPIFY_INSTALL_REDIRECT_URI=${SHOPIFY_INSTALL_REDIRECT_URI:-}" \
                      "SHOPIFY_INSTALL_REGION=${SHOPIFY_INSTALL_REGION:-}" \
                      "SHOPIFY_INSTALL_SCOPES=${SHOPIFY_INSTALL_SCOPES:-}" \
                      "SHOPIFY_DELEGATE_SCOPES=${SHOPIFY_DELEGATE_SCOPES:-}"; do
            case "$pair" in
              *@*) echo "::error::the repo variable behind '${pair%%=*}' contains an '@', which is the" \
                        "--set-env-vars delimiter. Its value would be split into bogus env pairs. Remove it."
                   exit 1 ;;
            esac
          done

          SECRETS="DATABASE_URL=palup-staging-database-url:latest"
          SECRETS="${SECRETS},WIDGET_TOKEN_SECRET=widget-token-secret:latest"
          SECRETS="${SECRETS},PALUP_SECRETS=palup-secrets:latest"
          if [ -n "${AUDIT_HMAC_SECRET_NAME:-}" ]; then
            SECRETS="${SECRETS},AUDIT_HMAC_SECRET=${AUDIT_HMAC_SECRET_NAME}:latest"
            echo "mounting AUDIT_HMAC_SECRET from secret '${AUDIT_HMAC_SECRET_NAME}'"
          else
            echo "AUDIT_HMAC_SECRET not mounted — GDPR-erasure audit rows will record" \
                 "'unreferenced (no AUDIT_HMAC_SECRET configured)' instead of a keyed subject ref." \
                 "Create the secret, then set the AUDIT_HMAC_SECRET_NAME repo variable to its name."
          fi

          # ADR-0019 R2-4 — a SEPARATE secret from WIDGET_TOKEN_SECRET/SHOPPER_TOKEN_SECRET, so a
          # compromise of one token type cannot forge guest tokens. Same fail-safe as AUDIT_HMAC_SECRET
          # above: naming a Secret Manager secret that does not exist makes `gcloud run deploy` itself
          # fail, so this mounts only once an operator names an existing secret here.
          if [ -n "${GUEST_TOKEN_SECRET_NAME:-}" ]; then
            SECRETS="${SECRETS},GUEST_TOKEN_SECRET=${GUEST_TOKEN_SECRET_NAME}:latest"
            echo "mounting GUEST_TOKEN_SECRET from secret '${GUEST_TOKEN_SECRET_NAME}'"
          else
            echo "GUEST_TOKEN_SECRET not mounted — guest tokens cannot be minted (ADR-0019); the" \
                 "guest-identity feature stays inert. Create the secret, then set the" \
                 "GUEST_TOKEN_SECRET_NAME repo variable to its name."
          fi

          # ^@^ delimiter: pairs split on '@', so the JSON values below keep their quotes and colons.
          # None of these values contains an '@'.
          ENVS="GOOGLE_CLOUD_PROJECT=${GCP_PROJECT}"
          ENVS="${ENVS}@GOOGLE_CLOUD_LOCATION=global"
          ENVS="${ENVS}@PALUP_MODEL=gemini-3.5-flash"
          ENVS="${ENVS}@PALUP_REQUIRE_DATABASE_URL=true"
          ENVS="${ENVS}@WIDGET_AUTH_REQUIRED=${WIDGET_AUTH_REQUIRED}"
          ENVS="${ENVS}@MERCHANT_CRED_READBACK_ENABLED=${MERCHANT_CRED_READBACK_ENABLED}"
          ENVS="${ENVS}@MERCHANT_CRED_SHARED_KEY_ENABLED=${MERCHANT_CRED_SHARED_KEY_ENABLED}"
          ENVS="${ENVS}@WIDGET_EMBED_KEYS={\"demo-embed-key\":\"demo\"}"
          ENVS="${ENVS}@SHOPIFY_STORES={\"demo\":\"palup-skincare-jason.myshopify.com\"}"
          ENVS="${ENVS}@MERCHANT_REGION=${MERCHANT_REGION}"
          ENVS="${ENVS}@MERCHANT_GROUNDING_MODE=${MERCHANT_GROUNDING_MODE}"
          # S2 — pins what a future `pnpm catalog:index` run embeds with (createVertexAdapter reads both
          # envs; catalog-index.ts's OFFLINE job is the only consumer of the embed path today). CONFIG-ONLY
          # and dark: this serves no shopper by itself — CATALOG_RETRIEVAL / VECTOR_ANN stay unset/off, so
          # /chat's serving path (getShell, decoupled from the index job) is untouched.
          # RE-CONFIRM AT BUILD (world fact, not independently verified in this session — no live Vertex/
          # doc access here): "gemini-embedding-2" appears in this repo only as an illustrative id in
          # comments/test fixtures (vertex-adapter.ts, vertex-embed.test.ts), never behind a dated primary
          # citation the way gemini-embedding-001 is ([E1]-[E5], vertex-adapter.ts:59-121). Confirm the
          # exact model-id string + GA status via `pnpm model:smoke` or a fresh docs.cloud.google.com check
          # before this is ever wired to a live index run. FALLBACK if it does not resolve:
          # gemini-embedding-001 @ 3072 (S1's halfvec(3072) path, pgvector-store.ts's VECTOR_INDEX_DIM_CAP).
          ENVS="${ENVS}@PALUP_EMBED_MODEL=gemini-embedding-2"
          ENVS="${ENVS}@PALUP_EMBED_DIMENSION=1536"

          # C1 — all-or-nothing. A partial set is a CONFIGURATION MISTAKE, and the runtime's correct
          # response to it (register nothing, 404) is the wrong response for a deploy: the operator who set
          # two of three needs to be told, not left with routes that are quietly absent.
          INSTALL_SET=0
          for v in "${SHOPIFY_APP_CLIENT_ID:-}" "${SHOPIFY_INSTALL_REDIRECT_URI:-}" "${SHOPIFY_INSTALL_REGION:-}"; do
            [ -n "$v" ] && INSTALL_SET=$((INSTALL_SET + 1)) || true
          done
          if [ "$INSTALL_SET" -gt 0 ] && [ "$INSTALL_SET" -lt 3 ]; then
            echo "::error::partial Shopify install config: SHOPIFY_APP_CLIENT_ID," \
                 "SHOPIFY_INSTALL_REDIRECT_URI and SHOPIFY_INSTALL_REGION must ALL be set as repo" \
                 "variables, or none of them. Set the missing ones or clear the rest."
            exit 1
          fi
          if [ "$INSTALL_SET" -eq 3 ]; then
            case "${SHOPIFY_INSTALL_REGION}" in
              us|eu|uk|other) ;;
              *) echo "::error::SHOPIFY_INSTALL_REGION must be us|eu|uk|other (it is written to every new" \
                      "merchant's pl_merchant row and decides their consent regime — it has no default)"
                 exit 1 ;;
            esac
            ENVS="${ENVS}@SHOPIFY_APP_CLIENT_ID=${SHOPIFY_APP_CLIENT_ID}"
            ENVS="${ENVS}@SHOPIFY_INSTALL_REDIRECT_URI=${SHOPIFY_INSTALL_REDIRECT_URI}"
            ENVS="${ENVS}@SHOPIFY_INSTALL_REGION=${SHOPIFY_INSTALL_REGION}"
            [ -n "${SHOPIFY_INSTALL_SCOPES:-}" ] && ENVS="${ENVS}@SHOPIFY_INSTALL_SCOPES=${SHOPIFY_INSTALL_SCOPES}" || true
            [ -n "${SHOPIFY_DELEGATE_SCOPES:-}" ] && ENVS="${ENVS}@SHOPIFY_DELEGATE_SCOPES=${SHOPIFY_DELEGATE_SCOPES}" || true
            echo "Shopify install env is complete; the routes still stay 404 until" \
                 "shopify_app_client_secret exists in the palup-secrets JSON under \"__shopify_app__\"."
          else
            echo "Shopify install/webhook env not configured — /shopify/* routes will 404 (inert, by design)."
          fi

          echo "env keys: $(echo "$ENVS" | tr '@' '\n' | cut -d= -f1 | tr '\n' ' ')"

          gcloud run deploy palup-widget-staging \
            --source . \
            --project "${GCP_PROJECT}" \
            --region "${GCP_REGION}" \
            --allow-unauthenticated \
            --add-cloudsql-instances "${GCP_PROJECT}:${GCP_REGION}:palup-staging" \
            --set-secrets "${SECRETS}" \
            --set-env-vars "^@^${ENVS}"

          # P4 — the durable Pub/Sub push env is applied in a SECOND, comma-delimited update because the push
          # SA email contains '@' (the ^@^ delimiter above would mis-split it). --update-env-vars MERGES, so
          # it re-adds these three AFTER the --set-env-vars above dropped them (they are not in ENVS). Gated
          # on the audience repo variable: absent ⇒ no-op ⇒ the route stays 404 (inert), exactly as before.
          # This registers only the CONSUME route; the PRODUCER stays off until CATALOG_WEBHOOKS is enabled.
          if [ -n "${CATALOG_PUBSUB_AUDIENCE:-}" ]; then
            echo "P4: registering the durable Pub/Sub push env (audience=${CATALOG_PUBSUB_AUDIENCE})"
            gcloud run services update palup-widget-staging \
              --project "${GCP_PROJECT}" \
              --region "${GCP_REGION}" \
              --update-env-vars "PUBSUB_CATALOG_TOPIC=catalog-reconcile,PUBSUB_PUSH_SERVICE_ACCOUNT=pubsub-catalog-push@${GCP_PROJECT}.iam.gserviceaccount.com,PUBSUB_PUSH_AUDIENCE=${CATALOG_PUBSUB_AUDIENCE}"
          else
            echo "CATALOG_PUBSUB_AUDIENCE not set — the Pub/Sub push route stays absent (inert)."
          fi
      - name: Post-deploy smoke gate (health + live /chat + auth)
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe palup-widget-staging \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION || 'us-central1' }}" --format 'value(status.url)')
          echo "staging URL: $URL"

          # 1) Health — service up AND the live Vertex model adapter is wired. Guards against a silent
          #    fall-back to the mock adapter (e.g. if GOOGLE_CLOUD_PROJECT ever drops out of the deploy env).
          HEALTH=$(curl -fsS --retry 5 --retry-connrefused --retry-delay 3 --max-time 30 "$URL/health")
          echo "health: $HEALTH"
          echo "$HEALTH" | jq -e '.ok == true' >/dev/null
          if [ "$(echo "$HEALTH" | jq -r '.model')" = "mock" ]; then
            echo "::error::/health reports model=mock — live Vertex adapter not wired"; exit 1
          fi

          # 1b) D1/D2 — the merchant registry is wired. `merchants` is "registry+env" when a durable
          #     pl_merchant is reachable and the env fallback is armed, "env" when there is no registry at
          #     all. "env" in staging would mean revocation does not revoke and every tenant is served
          #     under the process's region — precisely the two properties D1 and D2 exist to provide — so
          #     it fails the gate rather than passing quietly.
          MODE=$(echo "$HEALTH" | jq -r '.merchants')
          case "$MODE" in
            registry*) echo "merchant resolution: $MODE" ;;
            *) echo "::error::/health reports merchants=$MODE — no durable merchant registry is wired," \
                    "so revocation and per-merchant region are both inert"; exit 1 ;;
          esac

          # 2) Auth is ENFORCED — an unauthenticated /chat must be rejected (WIDGET_AUTH_REQUIRED=true).
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$URL/chat" \
            -H 'Content-Type: application/json' -d '{"message":"hello","sessionId":"smoke-noauth"}')
          [ "$CODE" = "401" ] || { echo "::error::unauthenticated /chat returned $CODE, expected 401"; exit 1; }
          echo "auth enforced: no-token /chat -> 401"

          # 3) Mint a widget token (built-in demo embed key -> demo tenant).
          TOKEN=$(curl -fsS --max-time 30 "$URL/widget/token?key=demo-embed-key" | jq -r '.token')
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::widget token mint failed"; exit 1; }

          # 4) Authenticated /chat exercises the FULL serving path end-to-end (HTTP -> token auth -> tenant
          #    bind -> brain -> live Gemini) and must return a real, non-empty reply — not the auth fall-back
          #    or the oversize-input rejection. Content is not asserted verbatim (the model is nondeterministic).
          RESP=$(curl -fsS --max-time 60 -X POST "$URL/chat" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"message":"Do you have a moisturizer for dry, sensitive skin?","sessionId":"smoke-live"}')
          echo "chat: $RESP"
          echo "$RESP" | jq -e '.reply | type == "string" and length > 0' >/dev/null
          REPLY=$(echo "$RESP" | jq -r '.reply')
          case "$REPLY" in
            "This assistant needs to be opened from the store page."*) echo "::error::authenticated /chat hit the auth fall-back"; exit 1 ;;
            "Sorry — that message is too long."*) echo "::error::/chat rejected the smoke message"; exit 1 ;;
          esac
          echo "live /chat end-to-end OK: ${REPLY:0:80}"
