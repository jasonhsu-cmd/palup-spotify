name: drift-check (manual)

# On-demand LIVE-model drift check — NO schedule. The offline eval is deterministic (mock model) and
# already runs in CI on every PR, so a timer adds nothing. Trigger this manually ("Run workflow") when
# you want to check the live model — e.g. after Google updates the floating gemini-2.5-flash alias:
# a live smoke + the cross-family judge (Gemini agent graded by Claude). Both guarded by config.
on:
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Auth to GCP
        if: ${{ vars.STAGING_ENABLED == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - name: Live model smoke
        if: ${{ vars.STAGING_ENABLED == 'true' }}
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT }}
          GOOGLE_CLOUD_LOCATION: global
          PALUP_MODEL: gemini-3.5-flash
        run: pnpm model:smoke "Recommend a gentle cleanser for sensitive skin in one sentence."

      # Cross-family judge: Gemini agent graded by Claude. Needs var JUDGE_ENABLED=true + secret ANTHROPIC_API_KEY.
      - name: Cross-family judge
        if: ${{ vars.JUDGE_ENABLED == 'true' }}
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT }}
          GOOGLE_CLOUD_LOCATION: global
          PALUP_MODEL: gemini-3.5-flash
          JUDGE_FAMILY: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm eval:judge

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/
